name: Publish Package to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for OIDC Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC Trusted Publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest (Trusted Publishing requires npm v11+)
        run: npm install -g npm@latest

      - name: Verify npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build package distribution
        run: npm run build

      # OIDC Trusted Publishing: No static secret/token required.
      # npm automatically exchanges the GitHub Actions OIDC token for short-lived publish credentials
      # and generates cryptographic provenance attestations.
      - name: Publish to npm
        run: npm publish --access public

